info:
  name: list-stations
  type: http
  seq: 1

http:
  method: POST
  url: "{{deyeBaseUrl}}/v1.0/station/list"
  headers:
    - name: Authorization
      value: Bearer   {{deyeDynamicAccessToken}}
  body:
    type: json
    data: |-
      {
        "page": 1,
        "size": 10
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
