info:
  name: list-devices
  type: http
  seq: 1

http:
  method: POST
  url: "{{deyeBaseUrl}}/v1.0/station/device"
  headers:
    - name: Authorization
      value: Bearer   {{deyeDynamicAccessToken}}
  body:
    type: json
    data: |-
      {
        "page": 1, 
        "size": 10, 
        "stationIds": ["{{deyeStationId}}"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
