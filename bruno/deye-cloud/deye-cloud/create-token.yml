info:
  name: create-token
  type: http
  seq: 1

http:
  method: POST
  url: "{{deyeBaseUrl}}/v1.0/account/token?appId={{deyeAppId}}"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: appId
      value: "{{deyeAppId}}"
      type: query
  body:
    type: json
    data: |-
      {
        "appSecret": "{{deyeAppSecret}}",
        "email": "{{deyeEmail}}",
        "password": "{{deyePassword}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("deyeDynamicAccessToken", res.body.accessToken);

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
