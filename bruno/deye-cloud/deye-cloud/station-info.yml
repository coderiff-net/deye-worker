info:
  name: station-info
  type: http
  seq: 1

http:
  method: POST
  url: "{{deyeBaseUrl}}/v1.0/station/latest"
  headers:
    - name: Authorization
      value: Bearer   {{deyeDynamicAccessToken}}
  body:
    type: json
    data: |-
      {
        "stationId": "{{deyeStationId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
