info:
  name: list-stations
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1.0/station/list"
  headers:
    - name: Authorization
      value: Bearer   {{dynamicAccessToken}}
  body:
    type: json
    data: |-
      {
        "page": 1,
        "size": 10
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
