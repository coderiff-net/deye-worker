info:
  name: station-info
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/v1.0/station/latest"
  headers:
    - name: Authorization
      value: Bearer   {{dynamicAccessToken}}
  body:
    type: json
    data: |-
      {
        "stationId": "{{stationId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
