info:
  name: list-devices
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1.0/station/device"
  headers:
    - name: Authorization
      value: Bearer   {{dynamicAccessToken}}
  body:
    type: json
    data: |-
      {
        "page": 1, 
        "size": 10, 
        "stationIds": ["{{stationId}}"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
